<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#613100">
<meta name="robots" content="noindex">
<title>אלבום תמונות- ישיבת מאור טוביה</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;800&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f4ee;--panel:#ffffff;--panel2:#efe9da;--line:#c9b89c;--fg:#3b2100;--dim:#7a5a33;--gold:#613100;--gold2:#c08e5b;--r:10px;--ease:cubic-bezier(.22,.8,.24,1);--display:"Frank Ruhl Libre",Georgia,serif;--body:"Assistant",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{overflow-x:clip}
html,body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1400px;margin:auto;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}

/* ===== כותרת ראשית ===== */
.hero{position:relative;overflow:hidden;min-height:clamp(420px,58vw,680px);display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;border-bottom:1px solid var(--line)}
.strip{position:absolute;inset:-40px 0 0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr;gap:3px;opacity:.55;will-change:transform}
.strip img{width:100%;height:100%;object-fit:cover;display:block;min-width:0;animation:kb 24s ease-in-out infinite alternate}
.strip img:nth-child(1){grid-column:span 2;grid-row:span 2}
.strip img:nth-child(6){grid-column:span 2}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 10%,rgba(233,231,223,.55) 45%,rgba(97,49,0,.15))}
.hero .txt{position:relative;z-index:1;width:100%;margin:0 auto;padding-block:0 28px;animation:rise .9s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.kicker{color:var(--gold);letter-spacing:.12em;font-weight:700;font-size:14px;margin:0 0 6px}
h1{font:800 clamp(46px,8vw,108px)/1 var(--display);margin:0 0 14px;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.stats li{background:rgba(22,30,43,.75);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:15px;font-variant-numeric:tabular-nums}
.stats b{color:var(--gold2);font-weight:700}

/* ===== סרגל סינון ===== */
.bar{position:sticky;top:0;z-index:5;background:rgba(233,231,223,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:10px}
.row{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}
.years{gap:4px 10px}
.years button{font:500 21px var(--display);color:var(--dim);padding:2px 4px;border-bottom:2px solid transparent;transition:color .2s}
.years button:hover{color:var(--fg)}
.years button.on{color:var(--gold);border-color:var(--gold)}
.search{flex:1 1 200px;min-width:0;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--fg);font:inherit;padding:7px 38px 7px 14px}
.search svg{position:absolute;right:13px;top:50%;translate:0 -50%;width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:2}
select{background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--fg);font:inherit;font-size:14px;padding:6px 12px}
.chips{margin-top:9px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;gap:6px}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;padding:4px 13px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--dim);transition:.2s}
.chips button:hover{color:var(--fg);border-color:var(--dim)}
.chips button.on{background:var(--gold);border-color:var(--gold);color:#10151f;font-weight:700}
.chips .n{opacity:.7;font-size:12px;margin-inline-start:5px;font-variant-numeric:tabular-nums}
.tags button{font-size:13px;padding:2px 11px;border-style:dashed}
.tags button::before{content:"#";opacity:.5;margin-inline-end:1px}
.tags .lbl{font-size:13px;color:var(--dim);white-space:nowrap}

/* ===== רשימת אלבומים ===== */
.yr{display:flex;align-items:baseline;gap:14px;margin:40px 0 14px}
.yr h2{font:800 clamp(44px,7vw,88px)/1 var(--display);color:var(--panel2);margin:0;-webkit-text-stroke:1px var(--line)}
.yr span{color:var(--dim);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.card{display:block;position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--panel);text-decoration:none;border-radius:var(--r);box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .4s var(--ease),box-shadow .4s}
.card:hover,.card.rv.in:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(0,0,0,.5)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--ease),filter .5s,opacity .6s;filter:brightness(.92)}
.card:hover img{transform:scale(1.07);filter:brightness(1.05)}
.card .cap{position:absolute;inset:auto 0 0;padding:44px 14px 12px;background:linear-gradient(transparent,rgba(8,11,17,.94))}
.card b{display:block;font:500 21px/1.2 var(--display);text-wrap:balance;color:#f2ede2}
.card small{color:#c8ccd4;font-variant-numeric:tabular-nums;font-size:13px}
.card .more{display:block;max-height:0;opacity:0;overflow:hidden;color:var(--gold2);font-size:13px;transition:max-height .4s var(--ease),opacity .3s}
.card:hover .more{max-height:24px;opacity:1}
.tag{position:absolute;top:10px;right:10px;background:rgba(8,11,17,.7);backdrop-filter:blur(4px);color:var(--gold2);font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.tag.new{background:var(--gold);color:#10151f}
.none{color:var(--dim);padding:60px 0;text-align:center}

/* כניסה בגלילה וטעינה הדרגתית */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.card.rv{transition:opacity .7s var(--ease),transform .7s var(--ease),box-shadow .4s}
.sk{background:linear-gradient(100deg,var(--panel) 30%,var(--panel2) 50%,var(--panel) 70%) 0 0/300% 100%;animation:shim 1.6s linear infinite}
.sk.ld{animation:none;background:var(--panel)}
@keyframes shim{to{background-position:-300% 0}}
.lz{opacity:0;filter:blur(12px);transform:scale(1.04)}
.lz.ld{opacity:1;filter:none;transform:none;transition:opacity .6s,filter .7s,transform .7s var(--ease)}

/* ===== עמוד אלבום ===== */
.ahero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.ahero .bgi{position:absolute;inset:-60px -30px;background-size:cover;background-position:center;filter:blur(24px) brightness(.45);will-change:transform}
.ahero .wrap{position:relative;padding-block:18px 20px;animation:rise .7s var(--ease) both}
.ahero h2{font:800 clamp(32px,5.5vw,64px)/1.1 var(--display);margin:16px 0 6px;text-wrap:balance}
.meta{color:#c8ccd4;margin:0 0 14px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:6px 15px;border:1px solid var(--line);border-radius:999px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:rgba(22,30,43,.6);transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#10151f;font-weight:700}
.btn.gold:hover{background:var(--gold2);color:#10151f}
.btn.on{color:var(--gold);border-color:var(--gold)}

/* בורר תצוגות */
.views{position:sticky;top:0;z-index:5;background:rgba(233,231,223,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.views .wrap{display:flex;gap:6px;align-items:center;padding-block:9px;overflow-x:auto;scrollbar-width:none}
.views .wrap::-webkit-scrollbar{display:none}
.views .lbl{color:var(--dim);font-size:13px;margin-inline-end:4px;white-space:nowrap}
.vb{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--dim);white-space:nowrap;transition:.25s}
.vb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.vb:hover{color:var(--fg)}
.vb.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.views .cnt{margin-inline-start:auto;color:var(--dim);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
#gal{transition:opacity .25s,transform .35s var(--ease)}
#gal.out{opacity:0;transform:translateY(12px)}

/* פריט תמונה משותף */
.ph{position:relative;display:block;overflow:hidden;border-radius:6px;text-decoration:none;isolation:isolate}
.ph img{width:100%;display:block}
.ph .img-wrap{display:block;overflow:hidden;height:100%}
.ph:hover img.ld{transform:scale(1.06);filter:brightness(1.12) contrast(1.04);transition:transform .7s var(--ease),filter .4s}
.ph .ov{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:10px;background:linear-gradient(transparent 55%,rgba(8,11,17,.8));opacity:0;transition:opacity .35s;pointer-events:none}
.ph:hover .ov,.ph:focus-visible .ov{opacity:1}
.ov small{font-size:12px;color:#e5e1d8;font-variant-numeric:tabular-nums;translate:0 6px;transition:translate .35s var(--ease)}
.ph:hover .ov small{translate:0 0}
.hb{pointer-events:auto;width:34px;height:34px;border-radius:50%;background:rgba(8,11,17,.6);backdrop-filter:blur(4px);font-size:17px;display:grid;place-items:center;color:#fff;transition:transform .2s}
.hb:hover{transform:scale(1.15)}
.hb.on{color:#ff6b7a}
.ph .hrt{position:absolute;top:7px;left:7px;color:#ff6b7a;font-size:16px;text-shadow:0 1px 4px #000;z-index:1}
.play{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;color:#fff;text-shadow:0 2px 10px #000;z-index:1;pointer-events:none}
#sent{height:1px}

/* א. פסיפס */
.v-mason{display:flex;gap:10px;align-items:flex-start;padding-block:18px 30px}
.v-mason .col{flex:1;min-width:0;display:grid;gap:10px}
.v-mason .ph{min-height:120px}

/* ב. מרחף */
.v-float{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:28px 3%;padding:50px 2% 80px}
.v-float .ph{min-height:100px;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.55);border:6px solid #f2ede2;background:#f2ede2;transition:transform .6s var(--ease),box-shadow .6s;rotate:var(--rot);translate:0 var(--dy)}
.v-float .ph.rv{opacity:0;transform:translateY(40px) scale(.94)}
.v-float .ph.rv.in{opacity:1;transform:none}
.card.rv{transition:opacity .7s var(--ease),transform .7s var(--ease),box-shadow .4s}
.v-float .ph>.img-wrap{animation:bob var(--dur) ease-in-out infinite alternate;animation-delay:var(--del);animation-play-state:paused}
.v-float .ph.in>.img-wrap{animation-play-state:running}
.v-float .ph.in:hover,.v-float .ph:not(.rv):hover{rotate:0deg;transform:scale(1.07);z-index:3;box-shadow:0 28px 60px rgba(0,0,0,.7)}
.v-float .ph .ov{border-radius:0}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-12px)}}

/* ג. מגזין */
.v-edit{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(70px,8.5vw,120px);grid-auto-flow:row dense;gap:12px;padding-block:24px 50px}
.v-edit .ph{border-radius:2px}
.v-edit .ph img{height:100%;object-fit:cover}
.e-xl{grid-column:span 8;grid-row:span 4}
.e-s{grid-column:span 4;grid-row:span 2}
.e-m5{grid-column:span 5;grid-row:span 3}
.e-m4{grid-column:span 4;grid-row:span 3}
.e-t{grid-column:span 4;grid-row:span 4}
.e-tx{grid-column:span 3;grid-row:span 3;display:flex;flex-direction:column;justify-content:space-between;border-top:2px solid var(--gold);padding-top:12px}
.e-tx .no{font:800 clamp(48px,6vw,86px)/.9 var(--display);color:var(--gold)}
.e-tx h3{font:500 clamp(19px,1.9vw,27px)/1.2 var(--display);margin:0;text-wrap:balance}
.e-tx p{margin:6px 0 0;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.e-q{grid-column:1/-1;grid-row:span 1;display:flex;align-items:center;gap:18px;color:var(--dim);font:500 clamp(18px,2vw,26px) var(--display);font-style:italic}
.e-q::before,.e-q::after{content:"";flex:1;height:1px;background:var(--line)}
.v-edit .cap2{position:absolute;bottom:0;right:0;background:var(--bg);color:var(--dim);font-size:12px;padding:3px 9px 0 0;z-index:1;font-variant-numeric:tabular-nums}

/* ד. אופקי */
.v-horiz{position:relative;padding-block:18px 10px;margin-inline:calc(50% - 50vw)}
.hs{display:flex;gap:14px;height:min(72vh,720px);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding-inline:22vw;cursor:grab;overscroll-behavior-x:contain}
.hs::-webkit-scrollbar{display:none}
.hs.drag{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.hs.drag .ph{pointer-events:none}
.v-horiz .ph{flex:none;height:100%;scroll-snap-align:center;border-radius:8px;min-width:30vh;opacity:.4;transform:scale(.94);transition:opacity .5s,transform .6s var(--ease)}
.v-horiz .ph.cen{opacity:1;transform:none}
.v-horiz .ph img{height:100%;width:auto;max-width:none}
.v-horiz .ph .img-wrap{height:100%}
.hnav{display:flex;gap:12px;align-items:center;justify-content:center;padding:14px 16px 40px}
.hnav button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);font-size:22px;transition:.2s}
.hnav button:hover{border-color:var(--gold);color:var(--gold)}
.hbar{flex:0 1 420px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.hbar i{display:block;height:100%;width:0;background:var(--gold);margin-inline-start:0;transition:width .2s}
.hnav span{color:var(--dim);font-size:13px;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}

.sibs{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:50px}
.sib{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-decoration:none;min-width:0;transition:.25s}
.sib:hover{border-color:var(--gold);transform:translateY(-2px)}
.sib img{width:72px;height:54px;object-fit:cover;border-radius:6px;flex:none}
.sib div{min-width:0}
.sib small{color:var(--dim);display:block;font-size:12px}
.sib b{font:500 17px/1.2 var(--display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sib.nx{flex-direction:row-reverse;text-align:left}

/* ===== מסך מלא ===== */
.lb{position:fixed;inset:0;z-index:20;background:rgba(5,7,11,.97);display:grid;grid-template-rows:auto 1fr auto;animation:lbin .35s var(--ease)}
@keyframes lbin{from{opacity:0}to{opacity:1}}
.lb.re{animation:none}
.lbtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;color:#f2ede2}
.lbtop span{flex:1;min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{position:relative;min-height:0;touch-action:pan-y;overflow:hidden}
.stage .fr{position:absolute;inset:0;animation:var(--anim,zin) .5s var(--ease)}
.stage img{max-width:100%;max-height:100%;position:absolute;inset:0;margin:auto}
.stage img.hi{opacity:0;transition:opacity .4s}
.stage img.hi.ld{opacity:1}
@keyframes zin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
.stage iframe{width:100%;height:100%;border:0;display:block}
.nav{position:absolute;top:50%;translate:0 -50%;font-size:38px;color:#f2ede2;background:rgba(8,11,17,.55);width:52px;height:78px;z-index:2;display:grid;place-items:center;text-decoration:none;border-radius:8px;transition:.2s}
.nav:hover{background:rgba(217,164,65,.9);color:#10151f}
.next{left:10px}.prev{right:10px}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.lbbot{padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.fav.on{color:#ff6b7a;border-color:#ff6b7a}

.top{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:18px;z-index:6;width:46px;height:46px;border-radius:50%;background:var(--gold);color:#10151f;font-size:22px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.top.show{opacity:1;pointer-events:auto}
.toast{position:fixed;bottom:80px;left:50%;translate:-50% 0;z-index:30;background:var(--gold);color:#10151f;font-weight:700;padding:8px 18px;border-radius:999px;animation:lbin .2s}

@media(max-width:700px){
  .nav{display:none}.sibs{grid-template-columns:1fr}
  .strip{grid-template-columns:repeat(3,1fr)}.strip img:nth-child(n+5){display:none}
  .years{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%}.years button{font-size:19px;white-space:nowrap}
  .hero{min-height:290px}
  .vb span{display:none}.vb{padding:7px 11px}
  .v-float{gap:22px 4%;padding-top:30px}
  .v-edit{grid-template-columns:repeat(6,1fr);grid-auto-rows:62px;gap:8px}
  .e-xl{grid-column:span 6;grid-row:span 4}.e-s{grid-column:span 3;grid-row:span 2}
  .e-m5,.e-m4{grid-column:span 3;grid-row:span 3}.e-t{grid-column:span 3;grid-row:span 4}
  .e-tx{grid-column:span 6;grid-row:span 2}
  .hs{height:62vh}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv,.lz{opacity:1;transform:none;filter:none}}
.hero-logo{position:relative;z-index:2;display:flex;justify-content:center;padding:22px 12px 0}
.hero-logo img{height:clamp(130px,20vw,210px);width:auto;max-width:90vw;object-fit:contain;background:rgba(255,255,255,.85);border-radius:18px;padding:10px 16px;box-shadow:0 10px 30px rgba(97,49,0,.18)}
</style>
</head>
<body>
<div id="app"></div>
<button class="top" id="top" aria-label="חזרה למעלה">↑</button>
<script>
const $=(s,r=document)=>r.querySelector(s),app=$('#app');
const th=(id,w)=>`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let K='',A=[],year='',cat='',q='',sort='new',lbOn=null,cur=null,ssTimer=null,slideshow=false,lastI=null,galCleanup=null;
const he=n=>n.toLocaleString('he-IL');
const cover=a=>{const p=a.f.filter(x=>!x[1]);return (p[Math.floor(p.length/3)]||a.f[0])[0]};
const vids=a=>a.f.filter(x=>x[1]).length;
const rnd=s=>{s=Math.sin(s*999.13)*43758.5453;return s-Math.floor(s)}; // אקראי קבוע לפי מספר
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* מועדפים */
let FAV=new Set(store.get('albumFavs',[]));
const fkey=(a,i)=>a.id+':'+a.f[i][0];
const toggleFav=(a,i)=>{const k=fkey(a,i);FAV.has(k)?FAV.delete(k):FAV.add(k);store.set('albumFavs',[...FAV]);return FAV.has(k)};
let VIEW=store.get('albumView','mason');
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1800)}
async function share(title){
  const url=location.href;
  if(navigator.share){try{await navigator.share({title,url});return}catch(e){if(e.name=='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('הקישור הועתק')}catch(e){}
}

/* אנימציית כניסה בגלילה */
const revIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in')}else if(e.target.dataset.loop)e.target.classList.remove('in')}),{rootMargin:'0px 0px -6% 0px'});
const reveal=el=>{if(RM){el.classList.add('in');return}el.classList.add('rv');revIO.observe(el)};
const onLoad=img=>{const f=()=>{img.classList.add('ld');img.closest('.sk')?.classList.add('ld')};img.complete&&img.naturalWidth?f():img.addEventListener('load',f,{once:true});img.addEventListener('error',f,{once:true})};

function card(a){
  const v=vids(a),isNew=a.y==A[0].y;

}
function list(){
  const t=q.trim();

  let html='';
  if(sort=='new'||sort=='old'){
    let ys=[...new Set(m.map(a=>a.y))];if(sort=='old')ys.reverse();
    html=ys.map(y=>{const g=m.filter(a=>a.y==y);if(sort=='old')g.reverse();
      return `<section><div class="yr"><h2>${esc(y)}</h2><span>${g.length} אירועים · ${he(g.reduce((s,a)=>s+a.f.length,0))} פריטים</span></div><div class="grid">${g.map(card).join('')}</div></section>`}).join('');
  }else{
    m=[...m].sort(sort=='big'?(a,b)=>b.f.length-a.f.length:(a,b)=>a.t.localeCompare(b.t,'he'));

  }

  L.innerHTML=(html||'<p class="none">לא נמצאו אלבומים. נסו מילה אחרת או בחרו "הכול".</p>')+'<div style="height:60px"></div>';
  L.querySelectorAll('.card').forEach((c,k)=>{c.style.transitionDelay=RM?'':`${(k%4)*60}ms`;reveal(c);onLoad(c.querySelector('img'));c.addEventListener('transitionend',()=>c.style.transitionDelay='',{once:true})});
  L.querySelectorAll('.yr').forEach(reveal);

const VIEWS=[
 ['mason','פסיפס','<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="11" rx="1"/><rect x="13" y="3" width="8" height="7" rx="1"/><rect x="3" y="16" width="8" height="5" rx="1"/><rect x="13" y="12" width="8" height="9" rx="1"/></svg>'],
 ['float','מרחף','<svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="9" height="7" rx="1" transform="rotate(-8 7 7.5)"/><rect x="12.5" y="9" width="9" height="7" rx="1" transform="rotate(7 17 12.5)"/><rect x="5" y="14" width="7" height="6" rx="1"/></svg>'],
 ['edit','מגזין','<svg viewBox="0 0 24 24"><rect x="3" y="3" width="11" height="11" rx="1"/><path d="M17 4h4M17 8h4M17 12h4M3 18h18M3 21h12"/></svg>'],

function photoEl(a,i,cls='',extra=''){
  const [id,v]=a.f[i],b=document.createElement('a'),fav=FAV.has(a.id+':'+id);
  b.className='ph sk '+cls;b.href=`#${K}/a/${a.id}/${i}`;b.dataset.i=i;b.dataset.aid=a.id;
  b.innerHTML=`<span class="img-wrap"><img class="lz" loading="lazy" alt="${esc(a.t)} ${i+1}" src="${th(id,cls.includes('e-xl')?1200:640)}"></span>${v?'<span class="play">▶</span>':''}${extra}
  <span class="ov"><small>${v?'סרטון':'תמונה'} ${i+1}</small><button class="hb ${fav?'on':''}" aria-label="מועדפים">${fav?'♥':'♡'}</button></span>`;
  onLoad(b.querySelector('img'));
  b.querySelector('.hb').onclick=e=>{e.preventDefault();e.stopPropagation();const on=toggleFav(a,i);e.currentTarget.classList.toggle('on',on);e.currentTarget.textContent=on?'♥':'♡';toast(on?'נוסף למועדפים':'הוסר מהמועדפים')};
  return b;
}
function cols(){return innerWidth<600?2:innerWidth<1000?3:innerWidth<1500?4:5}

/* items: מערך [אלבום, אינדקס]; title לטקסטים במגזין */
function gallery(host,items,title){
  galCleanup?.();
  let io=null,i=0,off=[];
  const g=document.createElement('div');g.id='gal';host.replaceChildren(g);
  const sentinel=()=>{const s=document.createElement('div');s.id='sent';return s};
  const watch=(more,root=null)=>{const s=sentinel();(root||host).append(s);io=new IntersectionObserver(e=>{if(e[0].isIntersecting)more()},{root,rootMargin:root?'0px 1200px':'1000px'});io.observe(s);return s};
  if(VIEW=='mason'){
    const n=cols();g.className='v-mason';g.innerHTML='<div class="col"></div>'.repeat(n);const cl=[...g.children];
    const more=()=>{const end=Math.min(i+30,items.length);for(;i<end;i++){const [a,k]=items[i],el=photoEl(a,k);cl[i%n].append(el);reveal(el)}if(i>=items.length)io?.disconnect()};
    more();io=new IntersectionObserver(e=>{if(e[0].isIntersecting)more()},{rootMargin:'1000px'});const s=sentinel();host.append(s);io.observe(s);off.push(()=>s.remove());
  }
  else if(VIEW=='float'){
    g.className='v-float';
    const W=innerWidth<700?[44,58,40,50,36]:[22,30,17,26,20,34,15];
    const more=()=>{const end=Math.min(i+24,items.length);for(;i<end;i++){const [a,k]=items[i],el=photoEl(a,k);const r=rnd(i+1),r2=rnd(i+7.3);
      el.style.width=W[Math.floor(r*W.length)]+'%';el.style.setProperty('--rot',((r2-.5)*7).toFixed(1)+'deg');el.style.setProperty('--dy',Math.round(rnd(i+3.1)*70)+'px');
      el.style.setProperty('--dur',(5+r*4).toFixed(1)+'s');el.style.setProperty('--del',(-r2*6).toFixed(1)+'s');el.dataset.loop=1;
      g.insertBefore(el,g.lastElementChild?.id=='sent'?g.lastElementChild:null);reveal(el)}if(i>=items.length)io?.disconnect()};
    more();watch(more);
  }
  else if(VIEW=='edit'){
    g.className='v-edit';
    const PAT=['e-xl','e-s','e-s','TX','e-m5','e-m4','e-t','e-s','e-t','e-s']; // 9 תמונות + טקסט לכל "עמוד"
    let spread=0;
    const more=()=>{const startI=i;const frag=document.createDocumentFragment();
      if(i>=items.length)return;
      const sp=spread++;const cnt=Math.min(9,items.length-i);
      if(sp>0&&sp%2==0){const qd=document.createElement('div');qd.className='e-q';qd.textContent=`${title} · פרק ${sp+1}`;frag.append(qd)}
      for(const p of PAT){
        if(p=='TX'){const t=document.createElement('div');t.className='e-tx';const [a0]=items[startI];
          t.innerHTML=`<span class="no">${String(sp+1).padStart(2,'0')}</span><div><h3>${esc(items.length&&title?title:a0.t)}</h3><p>${esc(a0.y)} · ${esc(a0.c)}<br>פריטים ${he(startI+1)}–${he(startI+cnt)} מתוך ${he(items.length)}</p></div>`;frag.append(t);reveal(t);continue}
        if(i>=items.length)break;const [a,k]=items[i];const el=photoEl(a,k,p);if(i==startI)el.insertAdjacentHTML('beforeend',`<span class="cap2">${String(i+1).padStart(3,'0')}</span>`);frag.append(el);reveal(el);i++;
      }
      g.insertBefore(frag,g.querySelector('#sent'));if(i>=items.length)io?.disconnect()};
    more();more();watch(more);
  }
  else{ // אופקי
    g.className='v-horiz';
    g.innerHTML=`<div class="hs" tabindex="0" aria-label="גלריה אופקית"></div><div class="hnav wrap"><button id="hp" aria-label="הקודם">→</button><div class="hbar"><i></i></div><span id="hc"></span><button id="hn" aria-label="הבא">←</button></div>`;
    const hs=$('.hs',g),bar=$('.hbar i',g),hc=$('#hc',g);
    const cenIO=new IntersectionObserver(es=>es.forEach(e=>{e.target.classList.toggle('cen',e.isIntersecting);if(e.isIntersecting)hc.textContent=`${he(+e.target.dataset.n+1)} / ${he(items.length)}`}),{root:hs,rootMargin:'0px -38% 0px -38%'});
    const more=()=>{const end=Math.min(i+20,items.length);for(;i<end;i++){const [a,k]=items[i],el=photoEl(a,k);el.dataset.n=i;hs.insertBefore(el,hs.querySelector('#sent'));cenIO.observe(el)}if(i>=items.length)io?.disconnect()};
    more();watch(more,hs);
    const step=d=>{const c=hs.querySelector('.ph.cen')||hs.querySelector('.ph');const t=d>0?c?.nextElementSibling:c?.previousElementSibling;if(t&&t.classList.contains('ph'))t.scrollIntoView({behavior:RM?'auto':'smooth',inline:'center',block:'nearest'})};
    $('#hn',g).onclick=()=>step(1);$('#hp',g).onclick=()=>step(-1);
    hs.onkeydown=e=>{if(e.key=='ArrowLeft'){e.preventDefault();step(1)}if(e.key=='ArrowRight'){e.preventDefault();step(-1)}};
    hs.addEventListener('scroll',()=>{const max=hs.scrollWidth-hs.clientWidth;bar.style.width=(max?Math.abs(hs.scrollLeft)/max*100:0)+'%'},{passive:true});
    let wl=0;hs.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;e.preventDefault();const now=Date.now();if(now-wl<380)return;wl=now;step(e.deltaY>0?1:-1)},{passive:false});
    let sx=0,sl=0,down=false,moved=false;
    hs.onpointerdown=e=>{if(e.pointerType!='mouse')return;down=true;moved=false;sx=e.clientX;sl=hs.scrollLeft};
    addEventListener('pointermove',e=>{if(!down)return;const d=e.clientX-sx;if(Math.abs(d)>5){moved=true;hs.classList.add('drag')}hs.scrollLeft=sl-d});
    const up=()=>{if(!down)return;down=false;if(moved){hs.classList.remove('drag');const c=[...hs.querySelectorAll('.ph')].find(p=>{const r=p.getBoundingClientRect();return r.left<innerWidth/2&&r.right>innerWidth/2});c?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}};
    addEventListener('pointerup',up);
    hs.addEventListener('click',e=>{if(moved){e.preventDefault();moved=false}},true);
    off.push(()=>{cenIO.disconnect();removeEventListener('pointerup',up)});
  }
  galCleanup=()=>{io?.disconnect();off.forEach(f=>f());galCleanup=null};
}
function viewBar(n,onPick){
  return `<nav class="views" aria-label="סוג תצוגה"><div class="wrap"><span class="lbl">תצוגה:</span>${VIEWS.map(([k,l,ic])=>`<button class="vb ${k==VIEW?'on':''}" data-v="${k}" aria-pressed="${k==VIEW}" title="${l}">${ic}<span>${l}</span></button>`).join('')}<span class="cnt">${he(n)} פריטים</span></div></nav>`;
}
function bindViews(host,items,title){
  app.querySelectorAll('.vb').forEach(b=>b.onclick=()=>{
    if(b.dataset.v==VIEW)return;VIEW=b.dataset.v;store.set('albumView',VIEW);
    app.querySelectorAll('.vb').forEach(x=>{x.classList.toggle('on',x==b);x.setAttribute('aria-pressed',x==b)});
    const g=$('#gal');const go=()=>{gallery(host,items,title);const ng=$('#gal');if(!RM){ng.classList.add('out');requestAnimationFrame(()=>requestAnimationFrame(()=>ng.classList.remove('out')))}};
    const vt=$('.views');const y=vt.getBoundingClientRect().top<=0?vt.offsetTop:null;
    if(RM||!g){go()}else{g.classList.add('out');setTimeout(()=>{go();if(y!=null)scrollTo({top:y})},250)}
  });
}

function light(a,i){
  const dir=lbOn&&lastI!=null?(i>lastI?'fromL':i<lastI?'fromR':'zin'):'zin',reopen=!!lbOn;
  closeLb(true);lastI=i;

  const [id,v]=a.f[i],n=a.f.length,isFav=FAV.has(fkey(a,i));
  el.innerHTML=`<div class="lbtop"><a class="btn" href="#${K}/a/${a.id}">✕ סגירה</a><span>${esc(a.t)} · ${i+1} מתוך ${he(n)}</span><button class="btn" id="fs" aria-label="מסך מלא">⛶</button></div>
  <div class="stage"><div class="fr" style="--anim:${dir}">${v?`<iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay;fullscreen" title="סרטון"></iframe>`:`<img alt="${esc(a.t)} ${i+1}" src="${th(id,640)}"><img class="hi" alt="" src="${th(id,1920)}">`}</div>
  ${i>0?`<a class="nav prev" href="#${K}/a/${a.id}/${i-1}" aria-label="הקודם">›</a>`:''}${i<n-1?`<a class="nav next" href="#${K}/a/${a.id}/${i+1}" aria-label="הבא">‹</a>`:''}</div>
  <div><div class="prog"><i style="width:${(i+1)/n*100}%"></i></div><div class="lbbot">
  <button class="btn ${slideshow?'on':''}" id="ssb">${slideshow?'❚❚ עצירת מצגת':'▶ מצגת'}</button>
  <button class="btn fav ${isFav?'on':''}" id="fv">${isFav?'♥ במועדפים':'♡ למועדפים'}</button>
  <button class="btn" id="cp2">שיתוף</button>

  document.body.append(el);document.body.style.overflow='hidden';lbOn=el;
  const hi=$('.hi',el);if(hi)onLoad(hi);
  [i-1,i+1].forEach(k=>{if(a.f[k]&&!a.f[k][1])new Image().src=th(a.f[k][0],1920)});
  $('#cp2',el).onclick=()=>share(a.t);
  $('#fs',el).onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{})};
  $('#fv',el).onclick=e=>{const on=toggleFav(a,i);e.currentTarget.classList.toggle('on',on);e.currentTarget.textContent=on?'♥ במועדפים':'♡ למועדפים';toast(on?'נוסף למועדפים':'הוסר מהמועדפים')};
  $('#ssb',el).onclick=()=>{slideshow=!slideshow;light(a,i)};
  if(slideshow){const k=nextPhoto(a,i);ssTimer=setTimeout(()=>{if(k<0){slideshow=false;light(a,i);toast('סוף המצגת')}else location.replace(`#${K}/a/${a.id}/${k}`)},v?1500:4500)}
  let sx=null;const st=$('.stage',el);
  st.ontouchstart=e=>sx=e.touches[0].clientX;
  st.ontouchend=e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>50){const k=d>0?i+1:i-1;if(a.f[k])location.replace(`#${K}/a/${a.id}/${k}`)}};
  lbOn.go=k=>{if(a.f[k])location.replace(`#${K}/a/${a.id}/${k}`)};lbOn.i=i;lbOn.back=cur=='fav'?`#${K}/fav`:`#${K}/a/${a.id}`;lbOn.ss=()=>{slideshow=!slideshow;light(a,i)};
  $('.lbtop .btn',el).href=lbOn.back;
}
function closeLb(keep){clearTimeout(ssTimer);if(!keep){slideshow=false;lastI=null}if(lbOn){lbOn.remove();lbOn=null;document.body.style.overflow=''}}
addEventListener('keydown',e=>{if(!lbOn)return;if(e.key=='Escape')location.hash=lbOn.back;if(e.key=='ArrowLeft')lbOn.go(lbOn.i+1);if(e.key=='ArrowRight')lbOn.go(lbOn.i-1);if(e.key==' '){e.preventDefault();lbOn.ss()}});
function refreshHearts(){app.querySelectorAll('.ph').forEach(p=>{const a=A.find(x=>x.id==p.dataset.aid),f=a?.f[+p.dataset.i];if(!f)return;const has=FAV.has(a.id+':'+f[0]),b=p.querySelector('.hb');if(b){b.classList.toggle('on',has);b.textContent=has?'♥':'♡'}})}
function route(){
  if(/^#[^/]+\/fav$/.test(location.hash)){const was=!!lbOn;closeLb();if(cur!='fav'){cur='fav';favs()}else if(was)refreshHearts();return}
  const m=location.hash.match(/^#[^/]+\/a\/([^/]+)(?:\/(\d+))?/),a=m&&A.find(x=>x.id==m[1]);
  if(!a){closeLb();cur=null;home();return}
  if(m[2]!=null&&a.f[+m[2]]){if(cur!==a.id&&cur!='fav'){album(a);cur=a.id}light(a,+m[2]);return}
  if(cur!==a.id){closeLb();album(a);cur=a.id}else{const was=!!lbOn;closeLb();if(was)refreshHearts()}
}
addEventListener('hashchange',route);
const topB=$('#top');topB.onclick=()=>scrollTo({top:0,behavior:RM?'auto':'smooth'});
const denied=()=>{app.innerHTML='<p class="wrap none">הגישה לאלבומים היא דרך הקישור המלא בלבד. בקשו את הקישור ממי ששיתף אתכם.</p>'};
K=location.hash.slice(1).split('/')[0];
(async()=>{
  if(!K)return denied();
  try{
    const raw=Uint8Array.from(atob(K.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
    const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    const b=new Uint8Array(await (await fetch('catalog.bin')).arrayBuffer());
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));
    A=JSON.parse(new TextDecoder().decode(pt));route();
  }catch(e){denied()}
})();
</script>
