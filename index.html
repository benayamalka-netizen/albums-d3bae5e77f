<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2456b8">
<title>אלבומי הישיבה</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2456b8; --blue-d:#1a3f8f; --gold:#f5b335; --coral:#ef6a4e;
  --green:#22a06b; --sky:#e7f0ff; --cream:#fffaf1; --ink:#1c2740; --muted:#667090;
  --card:#ffffff; --line:#eadfcf; --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;font-family:Assistant,system-ui,sans-serif;color:var(--ink);background:var(--cream);min-height:100%}
body{background:
  radial-gradient(1200px 500px at 90% -10%,#ffe7b8 0%,transparent 60%),
  radial-gradient(900px 500px at -10% 10%,#d9e8ff 0%,transparent 60%),
  var(--cream);}
a{color:inherit}
header{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--blue),#3b7be0);color:#fff;box-shadow:0 4px 18px rgba(36,86,184,.25)}
.bar{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;font-size:22px;letter-spacing:.2px;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(245,179,53,.3)}
.spacer{flex:1}
.back{background:#fff;color:var(--blue);border:0;border-radius:999px;padding:8px 16px;font:600 15px Assistant,sans-serif;cursor:pointer;text-decoration:none}
main{max-width:1200px;margin:auto;padding:22px 18px 60px}
.hero{padding:26px 22px;border-radius:24px;background:linear-gradient(120deg,#fff 0%,#fff3d6 55%,#ffe0d6 100%);border:1px solid var(--line);margin-bottom:24px}
.hero h1{margin:0 0 6px;font-size:30px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.chip{border:0;border-radius:999px;padding:8px 16px;font:600 14px Assistant,sans-serif;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--line)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
h2.section{font-size:20px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.section:before{content:"";width:6px;height:22px;border-radius:4px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.album{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.album:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(28,39,64,.12)}
.cover{aspect-ratio:4/3;background:var(--sky);position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .count{position:absolute;bottom:10px;inset-inline-start:10px;background:rgba(255,255,255,.92);color:var(--blue-d);font-weight:700;font-size:13px;border-radius:999px;padding:4px 10px}
.meta{padding:12px 14px 14px}
.meta b{display:block;font-size:16px;line-height:1.35;margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;margin-inline-end:6px;color:#fff}
.t0{background:var(--coral)}.t1{background:var(--green)}.t2{background:var(--blue)}.t3{background:#8a55d6}.t4{background:#e0901a}.t5{background:#d6457f}
.album-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
.album-head h1{margin:0;font-size:26px;font-weight:800}
.photos{columns:4 220px;column-gap:12px}
.ph{break-inside:avoid;margin:0 0 12px;border-radius:14px;overflow:hidden;background:var(--sky);cursor:zoom-in;border:0;padding:0;display:block;width:100%}
.ph img{width:100%;display:block;transition:transform .3s}
.ph:hover img{transform:scale(1.03)}
.more{display:block;margin:22px auto 0;background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:12px 28px;font:700 16px Assistant,sans-serif;cursor:pointer}
.more[hidden]{display:none}
.msg{padding:40px 20px;text-align:center;color:var(--muted);font-size:18px}
#lb{position:fixed;inset:0;background:rgba(18,26,44,.94);display:none;align-items:center;justify-content:center;z-index:50}
#lb.open{display:flex}
#lb img{max-width:92vw;max-height:84vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#lb .btn{position:absolute;background:#fff;color:var(--blue-d);border:0;border-radius:999px;width:46px;height:46px;font-size:22px;cursor:pointer;font-weight:700}
#lb .x{top:16px;inset-inline-end:16px}
#lb .prev{top:50%;inset-inline-start:16px;transform:translateY(-50%)}
#lb .next{top:50%;inset-inline-end:16px;transform:translateY(-50%)}
#lb .pos{position:absolute;bottom:18px;color:#fff;font-weight:600}
@media (max-width:600px){.hero h1{font-size:24px}.album-head h1{font-size:21px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#" id="home" onclick="this.href='#'+KEY"><span class="dot"></span>אלבומי הישיבה</a>
    <span class="spacer"></span>
    <a class="back" id="backBtn" href="#" hidden>← חזרה</a>
  </div>
</header>
<main id="app"><div class="msg">טוען אלבומים…</div></main>

<div id="lb" role="dialog" aria-modal="true">
  <button class="btn x" aria-label="סגירה">✕</button>
  <button class="btn prev" aria-label="הקודמת">›</button>
  <button class="btn next" aria-label="הבאה">‹</button>
  <img alt="">
  <div class="pos"></div>
</div>

<script>
const CAT_COLORS = {};
const TAG_CLASSES = ['t0','t1','t2','t3','t4','t5'];
let A = [];
const app = document.getElementById('app');
const backBtn = document.getElementById('backBtn');
const KEY = location.hash.slice(1).split('/')[0];
const thumb = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catClass = c => { if (!(c in CAT_COLORS)) CAT_COLORS[c] = TAG_CLASSES[Object.keys(CAT_COLORS).length % TAG_CLASSES.length]; return CAT_COLORS[c]; };

function setBack(on, href) { backBtn.hidden = !on; backBtn.href = href || '#' + KEY; }

function home() {
  setBack(false);
  const years = [...new Set(A.map(a => a.y))];
  const cats = [...new Set(A.map(a => a.c))];
  let activeYear = years[0], activeCat = null;
  const draw = () => {
    const list = A.filter(a => a.y === activeYear && (!activeCat || a.c === activeCat));
    const yearChips = years.map(y => `<button class="chip ${y===activeYear?'on':''}" data-y="${esc(y)}">${esc(y)}</button>`).join('');
    const catChips = [`<button class="chip ${!activeCat?'on':''}" data-c="">הכל</button>`]
      .concat(cats.map(c => `<button class="chip ${c===activeCat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`)).join('');
    const cards = list.map(a => {
      const cover = a.f[0] ? `<img loading="lazy" src="${thumb(a.f[0][0], 600)}" alt="">` : '';
      return `<a class="album" href="#${KEY}/a/${esc(a.id)}">
        <div class="cover">${cover}<span class="count">${a.f.length} תמונות</span></div>
        <div class="meta"><b>${esc(a.t)}</b><span class="tag ${catClass(a.c)}">${esc(a.c)}</span></div>
      </a>`;
    }).join('');
    app.innerHTML = `
      <section class="hero">
        <h1>אלבומי הישיבה</h1>
        <p>${A.length} אלבומים · בחרו שנה ונושא, ולחצו על אלבום לצפייה.</p>
        <div class="chips" id="years">${yearChips}</div>
        <div class="chips" id="cats">${catChips}</div>
      </section>
      <h2 class="section">${esc(activeYear)}${activeCat ? ' · ' + esc(activeCat) : ''}</h2>
      ${list.length ? `<div class="grid">${cards}</div>` : '<div class="msg">אין אלבומים להצגה בבחירה הזו.</div>'}`;
    document.getElementById('years').onclick = e => { const b = e.target.closest('[data-y]'); if (b) { activeYear = b.dataset.y; draw(); } };
    document.getElementById('cats').onclick = e => { const b = e.target.closest('[data-c]'); if (b) { activeCat = b.dataset.c || null; draw(); } };
  };
  draw();
}

let lbList = [], lbIndex = 0;
function openLb(list, i) {
  lbList = list; lbIndex = i;
  document.getElementById('lb').classList.add('open');
  showLb();
}
function showLb() {
  const img = document.querySelector('#lb img');
  img.src = thumb(lbList[lbIndex][0], 1600);
  document.querySelector('#lb .pos').textContent = `${lbIndex + 1} / ${lbList.length}`;
}
function stepLb(d) { lbIndex = (lbIndex + d + lbList.length) % lbList.length; showLb(); }
function closeLb() { document.getElementById('lb').classList.remove('open'); }
document.querySelector('#lb .x').onclick = closeLb;
document.querySelector('#lb .prev').onclick = () => stepLb(-1);
document.querySelector('#lb .next').onclick = () => stepLb(1);
document.getElementById('lb').onclick = e => { if (e.target.id === 'lb') closeLb(); };
addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') stepLb(-1);
  if (e.key === 'ArrowRight') stepLb(1);
});

const PAGE = 60;
function album(id) {
  const a = A.find(x => x.id === id);
  if (!a) return home();
  setBack(true, '#' + KEY);
  let shown = 0;
  app.innerHTML = `
    <div class="album-head">
      <div>
        <h1>${esc(a.t)}</h1>
        <div style="margin-top:8px"><span class="tag ${catClass(a.c)}">${esc(a.c)}</span><span class="tag t2">${esc(a.y)}</span></div>
      </div>
      <span style="color:var(--muted);font-weight:600">${a.f.length} תמונות</span>
    </div>
    <div class="photos" id="photos"></div>
    <button class="more" id="more">טען עוד</button>`;
  const more = () => {
    const frag = a.f.slice(shown, shown + PAGE).map((f, k) =>
      `<button class="ph" data-i="${shown + k}"><img loading="lazy" src="${thumb(f[0], 480)}" alt=""></button>`).join('');
    document.getElementById('photos').insertAdjacentHTML('beforeend', frag);
    shown += PAGE;
    document.getElementById('more').hidden = shown >= a.f.length;
  };
  document.getElementById('photos').onclick = e => {
    const b = e.target.closest('.ph'); if (b) openLb(a.f, +b.dataset.i);
  };
  document.getElementById('more').onclick = more;
  more();
  scrollTo(0, 0);
}

function route() {
  const parts = location.hash.slice(1).split('/');
  if (parts[1] === 'a' && parts[2]) album(parts[2]); else home();
}

const denied = () => { app.innerHTML = '<div class="msg">הגישה לאלבומים היא דרך הקישור המלא בלבד. בקשו את הקישור ממי ששיתף אתכם.</div>'; };

addEventListener('hashchange', route);
(async () => {
  if (!KEY) return denied();
  try {
    const raw = Uint8Array.from(atob(KEY.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const b = new Uint8Array(await (await fetch('catalog.bin')).arrayBuffer());
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12));
    A = JSON.parse(new TextDecoder().decode(pt));
    route();
  } catch (e) { denied(); }
})();
</script>
</body>
</html>
